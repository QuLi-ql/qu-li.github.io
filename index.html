<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小亚专属私聊室</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 12px;
        }
        #app {
            max-width: 700px;
            width: 100%;
            background: white;
            border-radius: 24px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.12);
            overflow: hidden;
        }
        /* 登录页 */
        #login {
            padding: 40px 24px;
            text-align: center;
        }
        #login h2 {
            font-size: 28px;
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 8px;
        }
        #login .subtitle {
            color: #64748b;
            margin-bottom: 32px;
            font-size: 14px;
        }
        #login input {
            width: 100%;
            max-width: 280px;
            padding: 14px 18px;
            border: 1px solid #e2e8f0;
            border-radius: 40px;
            font-size: 16px;
            outline: none;
            transition: 0.2s;
            margin-bottom: 24px;
        }
        #login input:focus {
            border-color: #0084ff;
            box-shadow: 0 0 0 3px rgba(0,132,255,0.15);
        }
        #login button {
            background: #0084ff;
            color: white;
            border: none;
            border-radius: 40px;
            padding: 14px 36px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
            box-shadow: 0 4px 8px rgba(0,132,255,0.25);
			width: 200px;                /* 与下拉框同宽 */
			box-sizing: border-box;       /* 确保内边距不会撑开宽度 */
        }
        #login button:hover {
            background: #0073e6;
        }
		/* 美化身份选择下拉框 */
		#login select {
			width: 200px;
			padding: 14px 18px;
			border: 1px solid #e2e8f0;
			border-radius: 40px;
			font-size: 16px;
			outline: none;
			transition: 0.2s;
			margin-bottom: 24px;
			background-color: white;
			cursor: pointer;
			appearance: none;           /* 移除默认箭头（可选），如果需要自定义箭头请额外处理 */
			box-sizing: border-box;      /* 让内边距计入总宽 */
			text-align: center;        /* 让文字居中 */
		}

		#login select:focus {
			border-color: #0084ff;
			box-shadow: 0 0 0 3px rgba(0,132,255,0.15);
		}

        /* 聊天主界面 */
        #chat {
            display: flex;
            flex-direction: column;
            height: 85vh;
            max-height: 750px;
        }
        #header {
            padding: 16px 20px;
            background: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 500;
        }
        #header span:first-child {
            font-size: 18px;
            color: #0f172a;
        }
        #onlineCount {
            background: #e2e8f0;
            padding: 6px 12px;
            border-radius: 40px;
            font-size: 13px;
            color: #334155;
        }
        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 18px;
            line-height: 1.5;
            word-wrap: break-word;
            position: relative;
        }
        .message .sender-name {
            font-size: 13px;
            margin-bottom: 4px;
            opacity: 0.8;
            font-weight: 500;
        }
        .my-message {
            background: #0084ff;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }
        .my-message .sender-name {
            color: rgba(255,255,255,0.8);
            text-align: right;
        }
        .other-message {
            background: #f1f3f5;
            color: #1e293b;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }
        .system-message {
            text-align: center;
            color: #94a3b8;
            font-size: 13px;
            margin: 8px 0;
            font-style: italic;
        }
        .message-image {
            max-width: 200px;
            max-height: 200px;
            border-radius: 12px;
            cursor: pointer;
            border: 1px solid rgba(0,0,0,0.1);
            transition: transform 0.1s;
        }
        .message-image:hover {
            transform: scale(1.02);
        }
        #input-area {
            display: flex;
            padding: 16px 20px;
            background: #f8fafc;
            border-top: 1px solid #e2e8f0;
            gap: 8px;
            align-items: center;
        }
        #message-input {
            flex: 1;
            padding: 12px 18px;
            border: 1px solid #e2e8f0;
            border-radius: 40px;
            font-size: 15px;
            outline: none;
            transition: 0.2s;
            background: white;
        }
        #message-input:focus {
            border-color: #0084ff;
        }
        #input-area button {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 40px;
            padding: 10px 18px;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            color: #334155;
        }
        #input-area button:hover {
            background: #f1f5f9;
            border-color: #cbd5e1;
        }
        #send-btn {
            background: #0084ff !important;
            color: white !important;
            border: none !important;
            padding-left: 24px !important;
            padding-right: 24px !important;
            font-weight: 500;
        }
        #send-btn:hover {
            background: #0073e6 !important;
        }
        #file-input {
            display: none;
        }
		/* 对方在线状态 */
		.status-dot {
			display: inline-block;
			width: 10px;
			height: 10px;
			border-radius: 50%;
			margin-left: 8px; /* 与前面文字留点间距 */
			margin-right: 4px;      /* 与文字间距 */
			vertical-align: middle;
			background-color: transparent; /* 初始透明 */
		}
		.status-dot.online {
			background-color: #4caf50; /* 绿色 */
		}
		.status-dot.offline {
			background-color: #f44336; /* 红色 */
		}
		#statusText {
			vertical-align: middle;
			font-size: 14px;
		}
		.online-dot {
			background-color: #4caf50; /* 绿色 */
		}
		.offline-dot {
			background-color: #f44336; /* 红色 */
		}
		/* 退出按钮美化 */
		.logout-btn {
			background: transparent;
			border: 1px solid #e2e8f0;
			border-radius: 30px;
			padding: 6px 16px;
			font-size: 13px;
			color: #64748b;
			cursor: pointer;
			transition: all 0.2s ease;
			margin-left: auto;
			outline: none;
			display: inline-flex;
			align-items: center;
			justify-content: center;
		}

		.logout-btn:hover {
			background-color: #f1f5f9;
			border-color: #cbd5e1;
			color: #1e293b;
		}

		.logout-btn:active {
			transform: scale(0.98);
		}
        /* 手机屏幕优化：当屏幕宽度小于 600px 时生效 */
        @media (max-width: 600px) {
        #chat {
            height: 90vh;
        }
        #input-area {
            flex-wrap: wrap;
            padding: 10px;
            gap: 5px;
        }
        #message-input {
            flex: 1 1 100%;
            margin-bottom: 5px;
            order: 1;
        }
        #image-btn {
            order: 2;
            flex: 0 0 auto;
        }
        #send-btn {
            order: 3;
            flex: 1 0 auto;
            margin-left: auto;
        }
        #input-area button {
            padding: 10px 16px;
            font-size: 16px;
        }
        #messages {
            padding: 15px;
        }
        }
    </style>
</head>
<body>
    <div id="app">
        <!-- 登录界面 -->
        <div id="login">
			<h2>小亚专属私聊室</h2>
			<div class="subtitle">选择你的身份</div>
			<select id="userSelector">
				<option value="user_a">美妹妹</option>
				<option value="user_b">帅哥哥</option>
			</select>
			<div id="loginMessage" style="color: red; margin-bottom: 10px; min-height: 20px;"></div>
			<br>
			<button onclick="login()">进入聊天</button>
		</div>

        <!-- 聊天主界面（初始隐藏） -->
        <div id="chat" style="display: none;">
            <div id="header">
                <span id="headerTitle">💬 与 <span id="targetName"></span> 私聊</span>
				<span id="onlineStatus">
					<span class="status-dot" id="statusDot"></span>
					<span id="statusText"></span>
				</span>
				<button class="logout-btn" onclick="logout()">退出</button>
            </div>
            <div id="messages"></div>
            <div id="input-area">
                <input type="text" id="message-input" placeholder="输入消息..." autocomplete="off">
                <button id="image-btn" onclick="document.getElementById('file-input').click()" title="发送图片">📷</button>
                <input type="file" id="file-input" accept="image/*" onchange="uploadImage(this)">
                <button id="send-btn" onclick="sendText()">发送</button>
            </div>
        </div>
    </div>

	<script>
		// 调试模式：打开控制台查看详细日志
		const DEBUG = true;
		// ========== 配置 ==========
		const apiBase = 'https://quli-hdlcqyaqdz.cn-hangzhou.fcapp.run';
		let userId = '';
		let userName = '';
		let lastMessageId = '';
		let pollingTimer = null;
		let targetUserId = '';
		let targetUserName = '';
		const displayedMessageIds = new Set(); // 存储所有已显示消息的ID（包括临时和真实）
		const pendingMessages = new Map();      // 存储待确认的消息：key=临时ID, value=消息对象
		
		// 心跳定时器
		let heartbeatTimer = null;
		// 开始心跳（在登录成功后调用）
		function startHeartbeat() {
			if (heartbeatTimer) clearInterval(heartbeatTimer);
			// 立即发送一次心跳，让在线人数立刻更新
			sendHeartbeat();
			// 然后每10秒发送一次
			heartbeatTimer = setInterval(sendHeartbeat, 10000);
		}
		// 发送心跳
		async function sendHeartbeat() {
			if (!userId || !targetUserId) return;
			try {
				const token = localStorage.getItem('chat_token');
				const response = await fetch(`${apiBase}/heartbeat?userId=${encodeURIComponent(userId)}&targetUserId=${encodeURIComponent(targetUserId)}`, {
					method: 'GET',
					headers: { 'Authorization': `Bearer ${token}` }
				});
				if (response.status === 401) {
					localStorage.clear();
					window.location.reload();
					return;
				}
				const data = await response.json();
				// 处理数据...
				if (data.targetOnline !== undefined) {
					const statusDot = document.getElementById('statusDot');
					const statusText = document.getElementById('statusText');
					if (data.targetOnline) {
						statusDot.classList.remove('offline');
						statusDot.classList.add('online');
						statusText.innerText = '在线';
					} else {
						statusDot.classList.remove('online');
						statusDot.classList.add('offline');
						statusText.innerText = '离线';
					}
				}
			} catch (err) {
				console.error('心跳失败', err);
			}
		}

		// ========== 工具函数 ==========
		function generateId() {
			return 'temp_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
		}

		// ========== 自动登录 ==========
		window.addEventListener('load', () => {
			const savedUserId = localStorage.getItem('chat_userId');
			const savedUserName = localStorage.getItem('chat_userName');
			const savedTargetUserId = localStorage.getItem('chat_targetUserId');
			const savedTargetUserName = localStorage.getItem('chat_targetUserName');
			const savedToken = localStorage.getItem('chat_token');
			if (savedUserId && savedUserName && savedTargetUserId && savedTargetUserName && savedToken) {
				userId = savedUserId;
				userName = savedUserName;
				targetUserId = savedTargetUserId;
				targetUserName = savedTargetUserName;
				token = savedToken;

				// 重置状态
				lastMessageId = '';
				displayedMessageIds.clear();

				document.getElementById('login').style.display = 'none';
				document.getElementById('chat').style.display = 'flex';
				document.getElementById('targetName').innerText = targetUserName;
				addSystemMessage('已自动登录');
				startPolling();
				startHeartbeat();
			} else {
				// 清除可能残留的旧数据
				localStorage.removeItem('chat_userId');
				localStorage.removeItem('chat_userName');
				localStorage.removeItem('chat_targetUserId');
				localStorage.removeItem('chat_targetUserName');
				localStorage.removeItem('chat_token');
				document.getElementById('login').style.display = 'block';
				document.getElementById('chat').style.display = 'none';
			}
		});

		async function verifyToken() {
			try {
				const response = await fetch(`${apiBase}/heartbeat?userId=${encodeURIComponent(userId)}&targetUserId=${encodeURIComponent(targetUserId)}`, {
					headers: { 'Authorization': `Bearer ${token}` }
				});
				if (response.status === 401) {
					localStorage.clear();
					window.location.reload();
				}
			} catch (err) {
				// 网络错误忽略
			}
		}
		
		async function logout() {
			const token = localStorage.getItem('chat_token');
			if (token) {
				// 可选：调用后端登出接口
				await fetch(`${apiBase}/logout`, {
					method: 'POST',
					headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
					body: JSON.stringify({ userId: localStorage.getItem('chat_userId') })
				}).catch(() => {});
			}
			localStorage.clear();
			window.location.reload();
		}
		
		// ========== 登录 ==========
		async function login() {
			console.log('login function called');
			const select = document.getElementById('userSelector');
			const selected = select.value;
			if (selected === 'user_a') {
				userId = 'user_a';
				userName = '美妹妹';
				targetUserId = 'user_b';
				targetUserName = '帅哥哥';
			} else {
				userId = 'user_b';
				userName = '帅哥哥';
				targetUserId = 'user_a';
				targetUserName = '美妹妹';
			}

			try {
				// 1. 发送登录请求获取 token
				console.log('准备发送登录请求到:', `${apiBase}/login`);
				const loginRes = await fetch(`${apiBase}/login`, {
					method: 'POST',
					headers: { 'Content-Type': 'application/json' },
					body: JSON.stringify({ userId })
				});
				console.log('登录请求已发送，状态码:', loginRes.status);
				const loginData = await loginRes.json();
				console.log('登录响应数据:', loginData);

				if (!loginRes.ok) {
					const loginMsgEl = document.getElementById('loginMessage');
					if (loginRes.status === 409) {
						loginMsgEl.innerText = '该账号已登录，不能重复登录';
					} else {
						const errorMsg = loginData.error || '登录失败';
						loginMsgEl.innerText = '登录失败：' + errorMsg;
					}
					return; // 停止执行，不进入聊天
				}
				// 登录成功，清空错误信息
        		document.getElementById('loginMessage').innerText = '';

				const token = loginData.token;
				console.log('获取到 token:', token);

				// 2. 保存用户信息及 token
				localStorage.setItem('chat_userId', userId);
				localStorage.setItem('chat_userName', userName);
				localStorage.setItem('chat_targetUserId', targetUserId);
				localStorage.setItem('chat_targetUserName', targetUserName);
				localStorage.setItem('chat_token', token);

				// 更新头部显示的对方昵称
				const targetNameEl = document.getElementById('targetName');
				if (targetNameEl) targetNameEl.innerText = targetUserName;

				// 重置轮询相关变量
				lastMessageId = '';
				displayedMessageIds.clear();

				// 隐藏登录界面，显示聊天界面
				document.getElementById('login').style.display = 'none';
				document.getElementById('chat').style.display = 'flex';
				addSystemMessage('你已加入私聊');

				// 启动轮询和心跳
				startPolling();
				startHeartbeat();
			} catch (err) {
				console.error('登录错误详细:', err);
				addSystemMessage('登录失败，请重试');
			}
		}

		// ========== 轮询 ==========
		function startPolling() {
			if (pollingTimer) clearInterval(pollingTimer);
			pollingTimer = setInterval(pollMessages, 2000);//2秒一次
		}

		async function pollMessages() {
			if (!userId) {
				console.warn('[poll] userId 为空，停止轮询');
				if (pollingTimer) clearInterval(pollingTimer);
				return;
			}
			if (DEBUG) console.log('[poll] 开始轮询，当前 lastMessageId =', lastMessageId);
			try {
				const token = localStorage.getItem('chat_token');
				if (!token) {
					// 没有 token，可能是未登录，停止轮询
					if (pollingTimer) clearInterval(pollingTimer);
					document.getElementById('login').style.display = 'block';
					document.getElementById('chat').style.display = 'none';
					return;
				}
				const url = `${apiBase}/getMessages?userId=${encodeURIComponent(userId)}&lastMessageId=${encodeURIComponent(lastMessageId)}`;
				const response = await fetch(url, {
					headers: { 'Authorization': `Bearer ${token}` }
				});
				if (response.status === 401) {
					localStorage.clear();
					window.location.reload();
					return;
				}
				const data = await response.json();
				// 处理数据...
				if (DEBUG) console.log('[poll] 收到数据:', data);
				if (data.messages && data.messages.length > 0) {
					if (DEBUG) console.log('[poll] 收到', data.messages.length, '条新消息');
					data.messages.forEach(msg => {
						const msgId = String(msg.id);
						if (DEBUG) console.log('[poll] 处理消息ID:', msgId, '发送者:', msg.senderId, '内容:', msg.content);
						if (displayedMessageIds.has(msgId)) {
							if (DEBUG) console.log('[poll] 跳过，ID已存在集合中');
						} else {
							if (DEBUG) console.log('[poll] 显示新消息');
							displayMessage(msg);
							displayedMessageIds.add(msgId);
							if (DEBUG) console.log('[poll] 已加入集合，当前集合:', Array.from(displayedMessageIds));
						}
					});
					// 更新 lastMessageId
					const lastMsg = data.messages[data.messages.length - 1];
					if (lastMsg) {
						const lastId = String(lastMsg.id);
						if (Number(lastId) > Number(lastMessageId)) {
							lastMessageId = lastId;
							if (DEBUG) console.log('[poll] 更新 lastMessageId =', lastMessageId);
						}
					}
				} else {
					if (DEBUG) console.log('[poll] 无新消息');
				}
			} catch (err) {
				console.error('[poll] 错误:', err);
			}
		}

		// ========== 发送文本消息 ==========
		async function sendText() {
			const input = document.getElementById('message-input');
			const text = input.value.trim();
			if (text === '') return;

			const tempId = generateId();
			const tempMsg = {
				id: tempId,
				senderId: userId,
				senderName: userName,
				type: 'text',
				content: text,
				targetUserId: targetUserId,
				sentTime: new Date().toISOString()
			};

			displayMessage(tempMsg, true);
			displayedMessageIds.add(tempId);
			input.value = '';

			try {
				const token = localStorage.getItem('chat_token');
				// 修复点：这里直接使用模板字符串拼接地址，而不是未定义的 url 变量
				const response = await fetch(`${apiBase}/sendMessage`, {
					method: 'POST',
					headers: {
						'Content-Type': 'application/json',
						'Authorization': `Bearer ${token}`
					},
					body: JSON.stringify(tempMsg)
				});

				if (response.status === 401) {
					localStorage.clear();
					window.location.reload();
					return;
				}

				const data = await response.json();
				if (data.id) {
					const realId = String(data.id);
					if (displayedMessageIds.has(tempId)) {
						displayedMessageIds.delete(tempId);
					}
					displayedMessageIds.add(realId);
					if (Number(realId) > Number(lastMessageId)) {
						lastMessageId = realId;
					}
				} else {
					addSystemMessage('消息发送失败: ' + (data.error || '未知错误'));
				}
			} catch (err) {
				console.error('[sendText] 错误:', err);
				addSystemMessage('网络错误，发送失败');
			}
		}

		// ========== 图片上传（简版，可自行完善） ==========
		async function uploadImage(input) {
			const file = input.files[0];
			if (!file) return;
			addSystemMessage('图片功能暂未实现，可先测试文字');
			input.value = '';
		}

		// ========== 显示消息（渲染到界面） ==========
		function displayMessage(msg, isMe = (msg.senderId === userId)) {
			const messagesDiv = document.getElementById('messages');
			const msgDiv = document.createElement('div');
			msgDiv.className = `message ${isMe ? 'my-message' : 'other-message'}`;

			// 存储ID（用于调试，非必须）
			msgDiv.dataset.id = msg.id;

			if (!isMe) {
				const nameSpan = document.createElement('div');
				nameSpan.className = 'sender-name';
				nameSpan.innerText = msg.senderName;
				msgDiv.appendChild(nameSpan);
			}

			if (msg.type === 'image') {
				const img = document.createElement('img');
				img.src = msg.content;
				img.className = 'message-image';
				img.onclick = () => window.open(msg.content);
				msgDiv.appendChild(img);
			} else {
				const textSpan = document.createElement('span');
				textSpan.innerText = msg.content;
				msgDiv.appendChild(textSpan);
			}

			messagesDiv.appendChild(msgDiv);
			messagesDiv.scrollTop = messagesDiv.scrollHeight;
		}

		// ========== 系统消息 ==========
		function addSystemMessage(text) {
			const messagesDiv = document.getElementById('messages');
			const div = document.createElement('div');
			div.className = 'system-message';
			div.innerText = text;
			messagesDiv.appendChild(div);
			messagesDiv.scrollTop = messagesDiv.scrollHeight;
		}

		// ========== 清理轮询 ==========
		window.addEventListener('beforeunload', () => {
			// 可选的离线通知暂不实现，避免 404
			if (heartbeatTimer) clearInterval(heartbeatTimer);
			if (pollingTimer) clearInterval(pollingTimer);
		});

		// ========== 按Enter发送 ==========
		document.getElementById('message-input').addEventListener('keypress', (e) => {
			if (e.key === 'Enter') sendText();
		});
	</script>
</body>
</html>
